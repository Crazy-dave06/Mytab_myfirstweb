<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MyTab · 书签面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="MyTab 首页"><span class="brand-icon">M</span><span><b>MyTab</b><small>你的个人起始页</small></span></a>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="切换主题" aria-label="切换主题">◐</button>
      <button id="settingsBtn" class="secondary-btn">⚙ 同步设置</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow" id="todayLabel">PERSONAL DASHBOARD</p>
      <h1 id="clock">你好，欢迎回来。</h1>
      <p class="subheading">把常用网站，放在触手可及的地方。</p>
      <label class="search-wrap" for="searchInput">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索书签、网址或分类…" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </section>

    <section class="toolbar">
      <div class="filters" id="categoryFilters" aria-label="书签分类"></div>
      <button id="addBtn" class="primary-btn">＋ 添加书签</button>
    </section>

    <section id="bookmarkGrid" class="bookmark-grid" aria-live="polite"></section>
    <section id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⌕</div><h2>没有找到书签</h2><p>试试其他关键词，或添加一个新书签。</p>
      <button id="emptyAddBtn" class="primary-btn">＋ 添加书签</button>
    </section>

    <footer class="footer">
      <span id="bookmarkCount">0 个书签</span>
      <span class="sync-status"><i id="statusDot"></i><span id="statusText">仅保存在此设备</span></span>
    </footer>
  </main>

  <dialog id="bookmarkDialog" class="dialog">
    <form id="bookmarkForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow">BOOKMARK</p><h2 id="bookmarkDialogTitle">添加书签</h2></div><button type="button" class="icon-btn close-btn" data-close="bookmarkDialog" aria-label="关闭">×</button></div>
      <input type="hidden" id="bookmarkId">
      <label>网站名称<input id="bookmarkTitle" required maxlength="80" placeholder="例如：GitHub"></label>
      <label>网址<input id="bookmarkUrl" required type="url" inputmode="url" placeholder="https://example.com"></label>
      <label>分类<input id="bookmarkCategory" maxlength="40" placeholder="例如：开发工具"></label>
      <label>图标文字（可选）<input id="bookmarkIcon" maxlength="4" placeholder="例如：GH、📚、🚀"></label>
      <p class="form-hint">网址必须以 http:// 或 https:// 开头。</p>
      <div class="dialog-actions"><button type="button" class="secondary-btn" data-close="bookmarkDialog">取消</button><button type="submit" class="primary-btn">保存书签</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="dialog wide-dialog">
    <form id="settingsForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow">CLOUD SYNC</p><h2>WebDAV 同步设置</h2></div><button type="button" class="icon-btn close-btn" data-close="settingsDialog" aria-label="关闭">×</button></div>
      <div class="notice"><b>安全提示</b><p>请仅连接你信任的 WebDAV 服务，并优先使用 HTTPS。密码只保存在当前页面的内存中，刷新后需要重新输入；不要把密码写进源码或分享给别人。</p></div>
      <label>书签文件完整 URL
        <input id="davUrl" type="url" inputmode="url" placeholder="https://dav.example.com/path/mytab-bookmarks.json" autocomplete="url">
        <small>填写一个文件地址，而不是仅填写服务器根目录。服务器端需允许 GET、PUT，并正确配置 CORS。</small>
      </label>
      <label>用户名<input id="davUser" autocomplete="username" placeholder="WebDAV 用户名"></label>
      <label>密码 / 应用专用密码<input id="davPassword" type="password" autocomplete="current-password" placeholder="仅在本次页面打开期间保留"></label>
      <div class="settings-actions">
        <button type="button" id="testDavBtn" class="secondary-btn">测试连接</button>
        <button type="button" id="downloadDavBtn" class="secondary-btn">从云端下载</button>
        <button type="button" id="uploadDavBtn" class="primary-btn">上传本地书签</button>
      </div>
      <div id="settingsMessage" class="settings-message" role="status"></div>
      <div class="dialog-actions"><button type="button" class="secondary-btn" data-close="settingsDialog">关闭</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
